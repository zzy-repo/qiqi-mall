user  nginx;   # 与镜像默认一致：素材靠权限放开到 a+rX，不用 root 换省事
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        listen  [::]:80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        # 内部文件不对外
        location ~ ^/(_evidence|_deploy)/ { deny all; return 404; }
        location = /build-material.mjs { deny all; return 404; }

        # 素材直出：容器内软链到宿主 /root/qiqi-mall 的路径不存在，
        # 因此把素材目录 bind mount 到 /mnt 下，再用 alias 对外暴露成 /_assets/{img,video}/
        location /_assets/img/ {
            alias /mnt/qiqi-docs/;
        }

        location /_assets/video/ {
            alias /mnt/qiqi-videos/;
        }

        # docsify 在子目录路由下会逐级探测 _sidebar.md，统一回落根目录那份（少一串 404）
        location ~ ^/(?:.+/)?_sidebar\.md$ {
            try_files $uri /_sidebar.md;
        }

        # 不要用 index.html 兜底：docsify 会按当前路由目录再取 _sidebar.md，
        # 兜底成 200 的 index.html 会被当成侧边栏内容渲染。缺失一律 404，交给 docsify 回退。
        location / {
            try_files $uri $uri/ =404;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
