# Rspress dev 站（doc_build_dev）—— 占旧 docsify 的 3027，语义对等：
# 旧 3027 服务的是 docsify dev 构建（含口语稿），现在换成 Rspress dev 构建（含口语稿 + 私人笔记）。
# 只读挂载静态产物，纯静态站，不转发任何 API。
user  root;   # 产物文件是 rspress build 出来的 600 root（docsify 产物是 644），
              # nginx 默认 worker 用户（nginx/uid 101）读不到；容器内只读挂载 + 仅内网访问，
              # worker 用 root 换取「重新构建后不用再 chmod」。生产 3010 不用这份 conf。
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        listen  [::]:80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        # Rspress 静态产物是 /a/b.html 形式：/a/b → /a/b.html；目录 → $uri/（index index.html）
        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        error_page   404  /404.html;
        location = /404.html {
            internal;
        }
    }
}
