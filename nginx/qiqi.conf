# 真实客户端 IP 透传：公网请求经过 ECS Caddy → Tailscale → 本机 nginx 两层代理。
#
# 【为什么不再按源 IP 判断可信】上一版用 geo 白名单（127.0.0.1 / 172.16.0.0/12 /
# 100.114.12.76）来筛「谁有资格给 X-Real-IP」，实测发现这条路走不通：从 tailscale0
# 进来的包会被 Tailscale 的
#     -A ts-postrouting -m mark --mark 0x40000/0xff0000 -j MASQUERADE
# （配合 docker 发布端口的 DNAT）抹掉源地址，到了容器里一律呈现为 172.21.0.1。
# 而 172.21.0.1 正落在 172.16.0.0/12 里面 ⇒ 100.114.12.76/32 那条规则永远不命中，
# 真正生效的只有那条宽网段；于是 tailnet 上任何设备（手机/笔记本/别的服务器）打
# 5174/5176/18080，源地址同样呈现为 172.21.0.1 = 「可信」，照样能伪造 X-Real-IP。
# 源 IP 在这条链路上无法区分来源，白名单形同虚设。
#
# 【现在的做法】不靠源 IP，靠共享密钥头（HTTP 头能穿过 SNAT）：
#   ECS 的 Caddy 反代前先 request_header 删掉客户端自带的 X-Qiqi-Proxy-Secret，
#   再 header_up 写入自己的密钥；本机 nginx 只认「带了正确密钥」的上游，
#   其它来源一律忽略它给的 X-Real-IP、改用直连地址（$remote_addr）。
# 密钥只存在于 ECS 的 Caddyfile 与本文件的 map 里，tailnet 其它设备无从得知。
# 链路有两跳：Caddy → 前端容器 → gateway（两个前端容器再反代到 gateway），
# 两跳都用同一个密钥：前端容器判定出 $qiqi_client_ip 后，要重新写一遍密钥头再交给
# gateway，否则 gateway 只看到前端容器 IP（172.21.x.x），真实 IP 就丢了。
# 注意：map 必须放在 http/server 作用域之外（本文件在 conf.d 下被 http 层 include）。
# 另外 X-Forwarded-For 也只发 $qiqi_client_ip 这一个值（不再用 $proxy_add_x_forwarded_for 追加）：
# 追加会把客户端自带的伪造值留在最左边，而 Spring 侧 ClientIp 取最左段、
# ForwardedHeaderFilter 也按最左段改写 remoteAddr，等于绕过下面的判定。
# 密钥是 64 位十六进制，作为 map 的 key 会超出默认的 map_hash_bucket_size（64），
# 不调大启动直接 [emerg] could not build map_hash。128 足够放下 64 字符 key。
map_hash_bucket_size 128;

map $http_x_qiqi_proxy_secret $qiqi_trusted_proxy {
    default    0;
    "5df2ba780d65e6fe9364244abca7aa1a1ef945a9a1b7f386d19a5cb0d41b2d55" 1;
}

map "$qiqi_trusted_proxy:$http_x_real_ip" $qiqi_client_ip {
    default          $remote_addr;      # 不可信来源：忽略它给的头，用直连地址
    "1:"             $remote_addr;      # 可信来源但没给头：用直连地址
    "~^1:.+$"        $http_x_real_ip;   # 可信来源且给了头：采信
}

# 访问日志用真实客户端 IP（$qiqi_client_ip）而不是前端容器 IP（$remote_addr），
# 否则 access.log 第一列永远是 172.21.x.x。log_format 同样必须在 http/server 之外。
log_format qiqi_main '$qiqi_client_ip - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time';

# 多实例流量入口：upstream 轮询两个应用实例
# 见 docs/multi-instance-plan.md 第 3 步 / docs/FIX-multi-instance.md Commit 3
# 注意：upstream 的容器 IP 在 nginx 启动时解析并被缓存。
# 重建/换镜像导致 server-1/server-2 的 IP 变化后，需要 `docker compose restart gateway`，
# 否则会出现 502（网关指向旧 IP）。滚动发布演练时请按此顺序：先建实例，再重启网关。
upstream qiqi_backend {
    server qiqi-server-1:8082;
    server qiqi-server-2:8083;
}

server {
    listen 80;
    server_name _;

    # 访问日志：第一列是真实客户端 IP（见上面 log_format qiqi_main）
    # /var/log/nginx/access.log 在官方镜像里是软链 → /dev/stdout（由 docker logs 收集）；
    # /var/log/nginx/qiqi-access.log 是容器内真实文件，方便 `docker exec ... tail` 直读。
    access_log /var/log/nginx/access.log qiqi_main;
    access_log /var/log/nginx/qiqi-access.log qiqi_main;

    # ---------------------------------------------------------------------
    # ★ 滚动发布时"零停机"靠的就是这一条（显式声明，不吃 nginx 默认值）
    # 滚动发布时 server-1 / server-2 轮流被 docker stop + 重建，网关手里随时会有一个
    # upstream 不可用（连不上 = error，或刚起来还在 502/503）。这里明确要求：这种失败
    # 就换下一台重试 —— 用户在滚动的那 1~2 秒里最多感知到一次重试，而不是 502 断服。
    # 为什么写出来：默认值同样是 error+timeout（不含 502/503），但"默认"是隐式依赖，
    # 谁改一行配置、换个 base 镜像版本就可能悄悄没了，那时零停机就无声退化。
    # scripts/publish.sh 的 preflight 会 grep 这一行，删了直接拒绝发布。
    # 注意：非幂等请求（POST）在上游已接单后失败 nginx 不会重试（这一条改不了），
    # 所以"一台一台滚 + reload"仍是正解，这里只是那几百毫秒的保险。
    proxy_next_upstream error timeout http_502 http_503;
    # ---------------------------------------------------------------------

    # 与两个前端容器的代理前缀保持一致（/portal/** 与 /admin/**），另加健康检查 /api/
    location /portal/ {
        proxy_pass http://qiqi_backend;
        proxy_set_header Host $host;
        # 密钥头只用于「上游是否可信」的判定，不往下游应用泄漏
        proxy_set_header X-Qiqi-Proxy-Secret "";
        # Spring 的 ForwardedHeaderFilter 会优先认 RFC 7239 的 Forwarded 头（比 XFF 优先级高），
        # 这里按同样口径清掉，免得客户端自带 Forwarded 绕过单值 XFF 直接改写 remoteAddr
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $qiqi_client_ip;
        # 单值 XFF：只用可信来源解析出的地址（见文件头说明）
        proxy_set_header X-Forwarded-For $qiqi_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://qiqi_backend;
        proxy_set_header Host $host;
        # 密钥头只用于「上游是否可信」的判定，不往下游应用泄漏
        proxy_set_header X-Qiqi-Proxy-Secret "";
        # Spring 的 ForwardedHeaderFilter 会优先认 RFC 7239 的 Forwarded 头（比 XFF 优先级高），
        # 这里按同样口径清掉，免得客户端自带 Forwarded 绕过单值 XFF 直接改写 remoteAddr
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $qiqi_client_ip;
        # 单值 XFF：只用可信来源解析出的地址（见文件头说明）
        proxy_set_header X-Forwarded-For $qiqi_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 图片上传：默认 1MB 限制不够
        client_max_body_size 6m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://qiqi_backend;
        proxy_set_header Host $host;
        # 健康检查也带上来源 IP，便于排查“谁在探活”
        # 密钥头只用于「上游是否可信」的判定，不往下游应用泄漏
        proxy_set_header X-Qiqi-Proxy-Secret "";
        # Spring 的 ForwardedHeaderFilter 会优先认 RFC 7239 的 Forwarded 头（比 XFF 优先级高），
        # 这里按同样口径清掉，免得客户端自带 Forwarded 绕过单值 XFF 直接改写 remoteAddr
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $qiqi_client_ip;
        # 单值 XFF：只用可信来源解析出的地址（见文件头说明）
        proxy_set_header X-Forwarded-For $qiqi_client_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # 接口文档（springdoc）：只精确匹配文档相关路径，不要写成 /v3 这种宽匹配，
    # 否则会把业务路由一起吞进来。生产应关闭或加鉴权，这里为测试环境放行。
    location ~ ^/(v3/api-docs|swagger-ui|swagger-resources) {
        proxy_pass http://qiqi_backend;
        proxy_set_header Host $host;
        # 密钥头只用于「上游是否可信」的判定，不往下游应用泄漏
        proxy_set_header X-Qiqi-Proxy-Secret "";
        # Spring 的 ForwardedHeaderFilter 会优先认 RFC 7239 的 Forwarded 头（比 XFF 优先级高），
        # 这里按同样口径清掉，免得客户端自带 Forwarded 绕过单值 XFF 直接改写 remoteAddr
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $qiqi_client_ip;
        # 单值 XFF：只用可信来源解析出的地址（见文件头说明）
        proxy_set_header X-Forwarded-For $qiqi_client_ip;
    }
}
