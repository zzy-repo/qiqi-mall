# 部署用编排（测试环境：容器栈跑的就是测试环境，连独立库 qiqi_mall_test）。开发不走容器，见 README「本地开发」
#   docker compose up -d --build
name: qiqi-mall

services:
  mysql:
    image: mysql:8
    container_name: qiqi-mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qiqi123456}
      MYSQL_DATABASE: qiqi_mall
    # 只绑定本机，供本地开发的后端连接；容器内服务用 mysql:3306
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次初始化（数据卷为空时）自动建表
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - qiqi-net

  # 应用实例 1（原 server）：多实例 + Redis 共享 KV
  server-1:
    build:
      context: ./qiqi-mall-server
    image: qiqi-mall-server:test
    container_name: qiqi-server-1
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILE: test
      SERVER_PORT: "8082"
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
      MYSQL_HOST: mysql
      # 容器栈（测试环境）连独立库 qiqi_mall_test，与本地开发用的 qiqi_mall 数据彻底隔离
      MYSQL_DATABASE: ${MYSQL_DATABASE_TEST:-qiqi_mall_test}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qiqi123456}
      JWT_SECRET: ${JWT_SECRET:-qiqi-mall-prod-secret-key-please-change-9876543210}
      # 留空 = 库里存相对路径 /qiqi-mall/**（图片由前端 nginx 反代/重定向，不绑访问地址）
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      # 对象存储（test profile = 阿里云 OSS）。凭证绝不写进本文件：只透传宿主机环境变量。
      # 宿主机来源：/root/.aliyun-qiqi/credentials.env 的 ALI_AK/ALI_SK
      #            → 项目根 .env（已进 .gitignore）里的 OSS_ACCESS_KEY/OSS_SECRET_KEY
      # 两个 key 缺任何一个，后端启动即失败（application-test.yml 的 require-credentials: true）
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-https://s3.oss-cn-beijing.aliyuncs.com}
      OSS_REGION: ${OSS_REGION:-cn-beijing}
      OSS_BUCKET: ${OSS_BUCKET:-qiqi-mall-static}
      # 回滚到 MinIO 时用（切回 application-test.yml 的 minio: 段即可复用这两个变量）
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-qiqiadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-qiqi123456}
      # 多实例共享验证码 / 幂等令牌
      KV_STORE: ${KV_STORE:-redis}
      REDIS_HOST: redis
      # mock 平台的地址（channel.mock.base-url）。容器内要按 compose 服务名解析：
      # 127.0.0.1:19090 是「宿主机上的 e2e mock」，容器里的 127.0.0.1 指的是容器自己。
      # 默认值与 application-test.yml 一致；真要临时指到别处（比如宿主机 mock，需 mock 监听 0.0.0.0）才覆盖它。
      CHANNEL_MOCK_BASE_URL: ${CHANNEL_MOCK_BASE_URL:-http://mock-platform:19090}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # mock 平台是「外部平台」的替身，起不来时后端照常启动（拉单会明确报不可达），
      # 但演示栈里它必须先在，所以这里等它健康再起应用，省得第一下拉单撞上空窗。
      mock-platform:
        condition: service_healthy
    expose:
      - "8082"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - qiqi-net

  # 应用实例 2（同镜像，另一端口）
  server-2:
    build:
      context: ./qiqi-mall-server
    image: qiqi-mall-server:test
    container_name: qiqi-server-2
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILE: test
      SERVER_PORT: "8083"
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
      MYSQL_HOST: mysql
      # 容器栈（测试环境）连独立库 qiqi_mall_test，与本地开发用的 qiqi_mall 数据彻底隔离
      MYSQL_DATABASE: ${MYSQL_DATABASE_TEST:-qiqi_mall_test}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qiqi123456}
      JWT_SECRET: ${JWT_SECRET:-qiqi-mall-prod-secret-key-please-change-9876543210}
      # 留空 = 库里存相对路径 /qiqi-mall/**（图片由前端 nginx 反代/重定向，不绑访问地址）
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      # 对象存储（test profile = 阿里云 OSS）。凭证绝不写进本文件：只透传宿主机环境变量。
      # 宿主机来源：/root/.aliyun-qiqi/credentials.env 的 ALI_AK/ALI_SK
      #            → 项目根 .env（已进 .gitignore）里的 OSS_ACCESS_KEY/OSS_SECRET_KEY
      # 两个 key 缺任何一个，后端启动即失败（application-test.yml 的 require-credentials: true）
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-https://s3.oss-cn-beijing.aliyuncs.com}
      OSS_REGION: ${OSS_REGION:-cn-beijing}
      OSS_BUCKET: ${OSS_BUCKET:-qiqi-mall-static}
      # 回滚到 MinIO 时用（切回 application-test.yml 的 minio: 段即可复用这两个变量）
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-qiqiadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-qiqi123456}
      KV_STORE: ${KV_STORE:-redis}
      REDIS_HOST: redis
      # mock 平台的地址（channel.mock.base-url）。容器内要按 compose 服务名解析：
      # 127.0.0.1:19090 是「宿主机上的 e2e mock」，容器里的 127.0.0.1 指的是容器自己。
      # 默认值与 application-test.yml 一致；真要临时指到别处（比如宿主机 mock，需 mock 监听 0.0.0.0）才覆盖它。
      CHANNEL_MOCK_BASE_URL: ${CHANNEL_MOCK_BASE_URL:-http://mock-platform:19090}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # mock 平台是「外部平台」的替身，起不来时后端照常启动（拉单会明确报不可达），
      # 但演示栈里它必须先在，所以这里等它健康再起应用，省得第一下拉单撞上空窗。
      mock-platform:
        condition: service_healthy
    expose:
      - "8083"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - qiqi-net

  # 流量入口：upstream 轮询两个实例（见 nginx/qiqi.conf）
  gateway:
    image: nginx:alpine
    container_name: qiqi-gateway
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./nginx/qiqi.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 宿主机 8080（cadvisor）/8090（已有 nginx）被占用，网关用 18080
      - "18080:80"
    depends_on:
      server-1:
        condition: service_healthy
      server-2:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - qiqi-net

  # Redis：多实例共享的进程外 KV（验证码 / 幂等令牌），见 docs/multi-instance-plan.md
  redis:
    image: redis:7-alpine
    container_name: qiqi-redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - qiqi-net

  # mock 平台（淘宝 / 抖音的「外部平台」替身）：多平台接入的拉单与回传发货都打它。
  # 源码就是仓库里的 mock-platform/server.mjs（零依赖单文件），挂进容器直接跑，不做镜像。
  #
  # ★ 不映射宿主机端口（下面只有 expose，没有 ports）★
  #   宿主机 19090 是 **e2e 分片专用**：e2e spec 自己 spawn 一份 mock 在 127.0.0.1:19090
  #   （见 e2e/tests/scenarios/业务/渠道-多平台接入/接入主链路.spec.js）。容器要是也绑宿主机
  #   19090，spec 的 spawn 就 EADDRINUSE，09 两条 spec 直接红 —— 所以这里只在 qiqi-net 内部
  #   用服务名 mock-platform:19090 暴露给 server-1/server-2。
  #   排查要不要从宿主机 curl？`docker compose exec mock-platform wget -qO- localhost:19090/health`
  mock-platform:
    image: node:22-alpine
    container_name: qiqi-mock-platform
    environment:
      TZ: Asia/Shanghai
      # 容器里的 127.0.0.1 只有容器自己能连，必须监听 0.0.0.0 才收得到 server-1/-2 的请求
      MOCK_HOST: 0.0.0.0
      MOCK_PORT: "19090"
      # 平台商品编码写成 SKU-<id>，这些 id 必须真的存在于业务库（否则整单走 SKU_NOT_MATCHED）。
      # 默认 1,2,3 = 测试库 qiqi_mall_test 的 sku.id 1~3。
      MOCK_SKU_IDS: ${MOCK_SKU_IDS:-1,2,3}
      MOCK_TAOBAO_ORDERS: ${MOCK_TAOBAO_ORDERS:-2}
      MOCK_DOUYIN_ORDERS: ${MOCK_DOUYIN_ORDERS:-1}
      # 不设 MOCK_RUN_ID = 用进程启动时间：每次重启本服务就是「一批新平台单」，
      # 不重启则重复拉单返回同一批（这正是演示幂等 SKIP 的前提）。
    working_dir: /app
    command: ["node", "server.mjs"]
    volumes:
      # 只读挂载：容器只跑这份源码，不回写仓库
      - ./mock-platform:/app:ro
    expose:
      - "19090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:19090/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - qiqi-net

  # MinIO 对象存储：商品图片（见 docs/flows/9-图片上传时序图）
  minio:
    image: minio/minio:latest
    container_name: qiqi-minio
    # 图片上传依赖；镜像不可用时可跳过（后端会降级为「上传不可用」，其余功能正常）
    # 启用：docker compose --profile minio up -d minio
    profiles: ["minio"]
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-qiqiadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-qiqi123456}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API，浏览器 <img src> 直连
      - "9001:9001"   # 控制台
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - qiqi-net

  # C 端买家商城（portal）
  portal-web:
    build:
      context: ./portal-web
      args:
        BUILD_MODE: test
        # 前端静态资源 CDN 基址（见 scripts/upload-web-assets.sh）。
        # ★默认空 = 现状：index.html 引用 /assets/**，容器自托管（dev/e2e/回滚零影响）。
        # 要切 CDN 时这样构建（前缀必须带结尾斜杠）：
        #   PORTAL_CDN_BASE=https://cdn.rose7.cn/qiqi-mall/portal-web/ docker compose build portal-web
        CDN_BASE: ${PORTAL_CDN_BASE:-}
    image: qiqi-portal-web:test
    container_name: qiqi-portal-web
    environment:
      TZ: Asia/Shanghai
      BACKEND_UPSTREAM: http://gateway
      # 商品图（/qiqi-mall/**）在 test 链路统一 301 到该 CDN（源站 = 阿里云 OSS bucket）
      IMG_CDN_BASE: ${IMG_CDN_BASE:-https://cdn.rose7.cn}
    ports:
      - "5174:80"
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - qiqi-net

  # B 端管理后台（admin）
  admin-web:
    build:
      context: ./admin-web
      args:
        BUILD_MODE: test
        # 前端静态资源 CDN 基址（见 scripts/upload-web-assets.sh）。
        # ★默认空 = 现状：index.html 引用 /assets/**，容器自托管（dev/e2e/回滚零影响）。
        # 要切 CDN 时这样构建（前缀必须带结尾斜杠）：
        #   ADMIN_CDN_BASE=https://cdn.rose7.cn/qiqi-mall/admin-web/ docker compose build admin-web
        CDN_BASE: ${ADMIN_CDN_BASE:-}
    image: qiqi-admin-web:test
    container_name: qiqi-admin-web
    environment:
      TZ: Asia/Shanghai
      BACKEND_UPSTREAM: http://gateway
      # 商品图（/qiqi-mall/**）在 test 链路统一 301 到该 CDN（源站 = 阿里云 OSS bucket）
      IMG_CDN_BASE: ${IMG_CDN_BASE:-https://cdn.rose7.cn}
    ports:
      - "5176:80"
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - qiqi-net

networks:
  qiqi-net:
    driver: bridge

volumes:
  mysql-data:
  minio-data:
  redis-data:
