# 部署用编排（生产）。开发不走容器，见 README「本地开发」
#   docker compose up -d --build
name: qiqi-mall

services:
  mysql:
    image: mysql:8
    container_name: qiqi-mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qiqi123456}
      MYSQL_DATABASE: qiqi_mall
    # 只绑定本机，供本地开发的后端连接；容器内服务用 mysql:3306
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次初始化（数据卷为空时）自动建表
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - qiqi-net

  server:
    build:
      context: ./qiqi-mall-server
    image: qiqi-mall-server:prod
    container_name: qiqi-server
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILE: prod
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qiqi123456}
      # JWT 密钥（生产务必覆盖）
      JWT_SECRET: ${JWT_SECRET:-qiqi-mall-prod-secret-key-please-change-9876543210}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-qiqiadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-qiqi123456}
      # 浏览器访问 MinIO 的地址（宿主机侧），部署机固定 IP 时可换成 http://<IP>:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://127.0.0.1:9000}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    # 不映射到宿主机：仅通过 compose 内网由前端 nginx 访问
    # 临时联调需要直连时，取消下面注释（建议绑 127.0.0.1 而非 0.0.0.0）
    # ports:
    #   - "127.0.0.1:8082:8082"
    expose:
      - "8082"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - qiqi-net

  # MinIO 对象存储：商品图片（见 docs/flows/9-图片上传时序图）
  minio:
    image: minio/minio:latest
    container_name: qiqi-minio
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-qiqiadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-qiqi123456}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API，浏览器 <img src> 直连
      - "9001:9001"   # 控制台
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - qiqi-net

  # C 端买家商城（portal）
  portal-web:
    build:
      context: ./portal-web
      args:
        BUILD_MODE: production
    image: qiqi-portal-web:prod
    container_name: qiqi-portal-web
    environment:
      TZ: Asia/Shanghai
      BACKEND_UPSTREAM: http://server:8082
    ports:
      - "5174:80"
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    networks:
      - qiqi-net

  # B 端管理后台（admin）
  admin-web:
    build:
      context: ./admin-web
      args:
        BUILD_MODE: production
    image: qiqi-admin-web:prod
    container_name: qiqi-admin-web
    environment:
      TZ: Asia/Shanghai
      BACKEND_UPSTREAM: http://server:8082
    ports:
      - "5176:80"
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    networks:
      - qiqi-net

networks:
  qiqi-net:
    driver: bridge

volumes:
  mysql-data:
  minio-data:
