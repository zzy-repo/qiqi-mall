# 部署用编排（生产）。开发不走容器，见 README「本地开发」
#   docker compose up -d --build
name: qiqi-mall

services:
  mysql:
    image: mysql:8
    container_name: qiqi-mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qiqi123456}
      MYSQL_DATABASE: qiqi_mall
    # 只绑定本机，供本地开发的后端连接；容器内服务用 mysql:3306
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次初始化（数据卷为空时）自动建表
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - qiqi-net

  server:
    build:
      context: ./qiqi-mall-server
    image: qiqi-mall-server:prod
    container_name: qiqi-server
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILE: prod
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
    # 不映射到宿主机：仅通过 compose 内网由前端 nginx 访问
    # 临时联调需要直连时，取消下面注释（建议绑 127.0.0.1 而非 0.0.0.0）
    # ports:
    #   - "127.0.0.1:8082:8082"
    expose:
      - "8082"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - qiqi-net

  web:
    build:
      context: ./qiqi-mall-web
      args:
        BUILD_MODE: production
    image: qiqi-mall-web:prod
    container_name: qiqi-web
    environment:
      TZ: Asia/Shanghai
      BACKEND_UPSTREAM: http://server:8082
    ports:
      - "5174:80"
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    networks:
      - qiqi-net

networks:
  qiqi-net:
    driver: bridge

volumes:
  mysql-data:
