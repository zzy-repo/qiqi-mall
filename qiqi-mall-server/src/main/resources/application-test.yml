# 测试环境（容器栈部署，连独立库 qiqi_mall_test）：端口 8082
server:
  port: ${SERVER_PORT:8082}
  address: 0.0.0.0
spring:
  servlet:
    multipart:
      # 图片上传上限：与 AdminUploadController 的 5MB 校验对齐（此前走 Spring 默认 1MB，
      # 导致 controller 里的 413 分支根本走不到）
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  datasource:
    # 库名可覆盖：容器编排用 MYSQL_DATABASE 注入（测试环境指向独立库 qiqi_mall_test，与 dev 库隔离）
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:qiqi_mall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:qiqi123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
logging:
  level:
    com.qiqi.mall: info
# 接口文档（springdoc-openapi）：dev 打开；将来若新增 prod profile，把 enabled 置 false 即可关闭
# 安全放行见 shared/security/SecurityConfig（/v3/api-docs/**、/swagger-ui/** 走 openChain）
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  packages-to-scan: com.qiqi.mall

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 鉴权配置
app:
  jwt:
    # 测试环境通过环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:qiqi-mall-prod-secret-key-please-change-9876543210}
    expire-minutes: 720
  minio:
    # 容器内地址（后端访问）；浏览器直连用 public-base-url
    endpoint: http://minio:9000
    # 留空 = 上传返回相对路径 /qiqi-mall/**（库里也存相对路径，前端 nginx / vite 反代到 MinIO）；
    # 需要走独立 CDN 时用 MINIO_PUBLIC_URL 配绝对地址
    public-base-url: ${MINIO_PUBLIC_URL:}
    access-key: ${MINIO_ACCESS_KEY:qiqiadmin}
    secret-key: ${MINIO_SECRET_KEY:qiqi123456}
    bucket: qiqi-mall
  # 进程外 KV：memory(单实例) | redis(多实例共享验证码/幂等令牌)
  kv-store: ${KV_STORE:memory}
