# 测试环境（容器栈部署，连独立库 qiqi_mall_test）：端口 8082
server:
  port: ${SERVER_PORT:8082}
  address: 0.0.0.0
  # 真实客户端 IP 透传：让 Spring 用 X-Forwarded-For / X-Forwarded-Proto / X-Forwarded-Host
  # 解析真实 IP、协议与主机（依赖 shared/web/ClientIp 与 nginx 传上游头，见 nginx/qiqi.conf）
  forward-headers-strategy: framework
spring:
  servlet:
    multipart:
      # 图片上传上限：与 AdminUploadController 的 5MB 校验对齐（此前走 Spring 默认 1MB，
      # 导致 controller 里的 413 分支根本走不到）
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  datasource:
    # ── JDBC URL 参数：useLocalSessionState=true（性能，不是随手调参）─────────────
    # 为什么开：Connector/J 默认对**每条语句**都发探针 `SELECT @@SESSION.transaction_read_only`
    #   （还有 autocommit / 隔离级别）去问服务器"我的会话状态变了吗"。开这个参数后驱动改用自己的
    #   本地视图，不再问。实测：每单语句数 18.8 → 12.5（**少 33%**）、天花板 447.6 → 494.4~501.4 ok/s
    #   （600 档 **+10.5%**、520 档 **+16.2%**）。数据正确性已验证：31,496 单审计零不一致。
    # 风险前提（这是它唯一的代价，别当成注释看过就算）：驱动从此**信任本地状态**。
    #   任何绕过驱动去改会话状态的写法（SET SESSION / SET TRANSACTION / SET autocommit / SET @@、
    #   setReadOnly / setTransactionIsolation、连接池 init-SQL、连接多路复用型代理）都会让本地视图
    #   与服务器真实状态**静默**分叉 —— 出错形态不是"崩"，而是**做错账**。
    #   所以"0 处绕过写法"必须是一条持续约束，不是一次性 grep：
    #     scripts/check-jdbc-session-safety.sh（CI + 发布前跑；publish.sh 的 preflight 已挂）
    # ★ 这套容器栈跑的就是 test profile（compose 里 SPRING_PROFILE=test），所以参数落在这里，
    #   本仓库**没有** application-prod.yml（将来新增 prod profile 时必须同步加上这一行，门禁会查）。
    # ★ 压测注入路径会**整体覆盖**这一行（bench/jdbc-url.override.yml 用 SPRING_DATASOURCE_URL
    #   透传完整 URL）；用 bench/tools/jdbc-url.sh 时，URL 里必须自己带上本参数，否则等于关掉它。
    # 库名可覆盖：容器编排用 MYSQL_DATABASE 注入（测试环境指向独立库 qiqi_mall_test，与 dev 库隔离）
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:qiqi_mall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useLocalSessionState=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:qiqi123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # ── 数据库结构版本管理（Flyway）──────────────────────────────────────────
  # 唯一事实来源：classpath:db/migration/V*.sql。加表/改表只写新版本文件，
  # 不要再写 sql/migrate-*.sql + zz_xxx_add_col 存储过程（老脚本已下线到 sql/_rollback/）。
  #
  # 两条路径（关键，别搞混）：
  #   已有库（结构已是最新、但没有历史表）→ baseline-on-migrate 只记一条 V1=BASELINE，**不执行 V1**
  #   空库（schema 里 0 个对象）          → Flyway 不会 baseline，直接全量执行 V1
  # baseline-version 必须与 V1 同号：写 1 表示"库里现在的状态 == V1 之后的状态"。
  #
  # 测试库 qiqi_mall_test 与 e2e 库（qiqi_mall_e2e_a/_b）共用本配置：
  #   - qiqi_mall_test 是已有库 → 显式 baseline 过
  #   - e2e 库每次 reset 都是「DROP DATABASE → CREATE → flyway migrate」，走空库路径
  # 所以 baseline-on-migrate 在这里既是兜底也必须开着（否则 initdb 重建的库起不来）。
  #
  # clean-disabled：flyway:clean 会 DROP 整个库，永远禁掉。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "baseline: 39 tables + v_biz_status_timeline (live schema 2026-11-13)"
    validate-on-migrate: true
    clean-disabled: true
    # 乱序迁移一律拒绝：版本号只能往后长，插队会导致"本地跑过、别人机器上跳过"
    out-of-order: false
logging:
  level:
    com.qiqi.mall: info
# 接口文档（springdoc-openapi）：dev 打开；将来若新增 prod profile，把 enabled 置 false 即可关闭
# 安全放行见 shared/security/SecurityConfig（/v3/api-docs/**、/swagger-ui/** 走 openChain）
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  packages-to-scan: com.qiqi.mall

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 鉴权配置
app:
  jwt:
    # 测试环境通过环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:qiqi-mall-prod-secret-key-please-change-9876543210}
    expire-minutes: 720
  # 对象存储：test（容器栈 / 公网 admin.rose7.cn）= 阿里云 OSS，读写同一处；
  # 读取侧由前端 nginx 把 /qiqi-mall/** 301 到 CDN（cdn.rose7.cn，源站就是这个 bucket）。
  #
  # 【为什么只有 test 切 OSS，dev（本机开发 + 4 个 e2e 库）继续用本机 MinIO 容器】
  #   1) e2e 会反复上传测试图。dev 若也指向 OSS，等于用测试流量污染生产存储：
  #      bucket 里混进一堆一次性测试图，且没有任何清理机制。
  #   2) 每跑一轮 e2e 都产生真实外网 PUT 流量与请求费（公网计费），纯浪费。
  #   3) dev 的 MinIO 在容器里、断了网络也能跑；e2e 不该依赖公网可用性。
  # 所以 dev 的 application-dev.yml 一个字都没动（endpoint 仍是 http://127.0.0.1:9000）。
  #
  # 走 MinIO Java SDK 8.5.12 的 S3 兼容协议连 OSS。endpoint/region 的取值是实测出来的：
  #   - endpoint=https://s3.oss-cn-beijing.aliyuncs.com + region=cn-beijing → putObject/list OK
  #   - endpoint=https://oss-cn-beijing.aliyuncs.com  + region=cn-beijing → putObject/list OK
  #   - 两种 endpoint 只要 region 留空，SDK 会退化成 path-style，OSS 直接回
  #     "Please use virtual hosted style to access" ⇒ region 必须显式给。
  # 这里取 s3.oss-cn-beijing.aliyuncs.com（阿里云文档给 S3 兼容 SDK 用的端点）。
  minio:
    endpoint: ${OSS_ENDPOINT:https://s3.oss-cn-beijing.aliyuncs.com}
    # OSS 必须显式 region，否则走 path-style 被拒（见上）
    region: ${OSS_REGION:cn-beijing}
    # 留空 = 上传返回相对路径 /qiqi-mall/**（库里也存相对路径，前端 nginx 再 301 到 CDN）；
    # 历史数据全是相对路径，所以这里不许配绝对地址
    public-base-url: ${MINIO_PUBLIC_URL:}
    # 凭证只从环境变量进（宿主机 credentials.env → docker-compose environment → 这里），
    # 配置文件和 git 里永远只有空占位。缺变量时 MinioConfig 会直接启动失败（require-credentials）。
    access-key: ${OSS_ACCESS_KEY:}
    secret-key: ${OSS_SECRET_KEY:}
    # bucket 必须是 qiqi-mall-static（ACL private，保持私有；CDN 回源鉴权已配通）
    bucket: ${OSS_BUCKET:qiqi-mall-static}
    # OSS 里 659 张历史图都在 qiqi-mall/ 前缀下，新图必须同前缀，否则 CDN 上新旧地址形式不一致
    object-key-prefix: qiqi-mall/
    # 返回给前端的 URL 路径前缀固定 qiqi-mall（对应 CDN 上 /qiqi-mall/**），与历史数据一致
    public-path-prefix: qiqi-mall
    # bucket 由运维创建且必须保持 private：应用不许 makeBucket、更不许改 bucket policy
    manage-bucket: false
    # 缺 OSS_ACCESS_KEY / OSS_SECRET_KEY 就启动失败，不静默降级到本地 MinIO
    require-credentials: true
  # 进程外 KV：memory(单实例) | redis(多实例共享验证码/幂等令牌)
  kv-store: ${KV_STORE:memory}

# 库存分桶（详见 sql/migrate-sku-bucket.sql 与 SkuBucketService）
#   为什么分桶：热点 SKU 的所有并发都挤在 `UPDATE sku ... WHERE id=?` 那一把行锁上，
#   TPS 上限 = 单行行锁吞吐。把同一份库存物理拆成 N 行（sku_bucket），并发就分散到 N 把锁。
#   sku.stock 降级为展示缓存（由 SUM(桶) 周期回写），扣减/回补都不再写它。
qiqi:
  # 自动审核调度开关：true=按 order_setting.audit_run_interval_min 定时跑（默认 30 分钟）
  #   出故障时第一动作是把它设成 false 并重启，而不是去改库里的开关
  #   集成测试在自己的上下文里关掉它，避免后台线程在断言之间偷偷跑一轮
  audit:
    schedule-enabled: ${AUDIT_SCHEDULE_ENABLED:true}
  # 台账写入开关（P2 第二步）：总闸 + 分项。总闸关掉 = 精确回到「只有状态写入、没有台账」的旧行为。
  # 默认全开（见 shared/ledger/LedgerProperties）；显式写在这里是为了出事时改一行就能回退，不用翻代码找默认值。
  # 启动日志会打印生效值：ledger.enabled=true status=true audit=true wms=true payment-trace=true
  ledger:
    enabled: true
    status-enabled: true
    audit-enabled: true
    wms-enabled: true
    payment-trace-enabled: true
  # ── 支付沙箱端点开关（qiqi.payment.*）─────────────────────────────────────
  # sandbox-endpoints-enabled=true 才开放 POST /admin/payments/{id}/replay-channel-callback
  #   （用库里那条流水的原 trade_no 再走一遍渠道回调，验证 uk_channel_trade 挡得住重复通知）。
  # 默认 false（见 oms/config/PaymentSandboxProperties）—— 生产必须保持 false：
  #   这个口子能让服务端主动去撞资金记账路径，留着就是拿钱赌运气。
  payment:
    sandbox-endpoints-enabled: true
  stock:
    # ── 两个开关：默认都 false = 与 baseline 完全一致（同一条扣减 SQL、同一条台账插入 SQL）──
    # 两个优化要分开归因，所以分两次镜像上线：
    #   镜像1 ledger-insert-ignore=true → 只量「台账插入改写」收益（L 阶段）
    #   镜像2 bucket-enabled=true       → 量「合并后」新拐点（E 阶段）
    # 连接池调参已按精简要求整体移除（回到 Spring Boot 默认 maximumPoolSize=10 /
    #   connectionTimeout=30s），不再作为压测变量。
    # 启动日志会打 `stock.mode=legacy|bucket(N=8) ledger=naive|ignore idem-shards=1`，压测方据此确认镜像身份。
    bucket-enabled: true
    ledger-insert-ignore: true
    # 幂等键打散前缀桶数：1 = 不加前缀（与历史数据逐字节一致，默认）。
    #   实测 8→64 分片 ±0% 增益 ⇒ 保留开关但默认关（1 = 无前缀）。
    #   ⚠️ 将来真要开（>1）的顺序（不可并发）：停流量 → 跑 sql/migrate-ledger-idem-shard.sql 回填旧行 → 起新镜像。
    #     反了会让旧触发重放算出「带前缀」的新键、查不到库里那行「无前缀」旧键 → 当成首次触发 → 重复扣/补。
    idem-key-shards: 1
    # 桶数 N：必须与 sql/migrate-sku-bucket.sql 回填里的数字一致（SQL 里读不到本配置）。
    #   dev / test 必须一致，否则同一套数据在两个环境的行为不同；压测对照时可临时改成 1
    #   （1 = 退化成原来的单行串行），改完重启生效。
    bucket-count: 8
    # 展示缓存回写周期（ms）：扣/补路径只标脏，落到 sku.stock 的频率按时间算，与下单 QPS 无关。
    #   250ms = 界面几乎实时，同时热点 SKU 每秒最多写 4 次 sku 行（原来是多少 QPS 就写多少次）。
    cache-refresh-ms: 250
    # 每轮最多回写多少个 SKU：限制单次任务耗时，避免一次刷新变成毛刺。
    cache-refresh-batch: 200
