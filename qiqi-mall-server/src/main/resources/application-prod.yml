# 生产环境：端口 8082
server:
  port: 8082
  address: 0.0.0.0
spring:
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/qiqi_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:qiqi123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
logging:
  level:
    com.qiqi.mall: info
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 鉴权配置
app:
  jwt:
    # 生产环境通过环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:qiqi-mall-prod-secret-key-please-change-9876543210}
    expire-minutes: 720
  minio:
    # 容器内地址（后端访问）；浏览器直连用 public-base-url
    endpoint: http://minio:9000
    public-base-url: ${MINIO_PUBLIC_URL:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:qiqiadmin}
    secret-key: ${MINIO_SECRET_KEY:qiqi123456}
    bucket: qiqi-mall
  # 进程外 KV：memory(单实例) | redis(多实例共享验证码/幂等令牌)
  kv-store: ${KV_STORE:memory}
